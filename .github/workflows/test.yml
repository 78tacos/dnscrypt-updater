name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o dnscrypt-proxy-updater${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/dnscrypt-proxy-updater

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Cross-compile Windows tray
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-H=windowsgui -s -w" -o dnscrypt-proxy-updater-windows-amd64.exe ./cmd/dnscrypt-proxy-updater
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-H=windowsgui -s -w" -o dnscrypt-proxy-updater-windows-arm64.exe ./cmd/dnscrypt-proxy-updater

  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Regenerated catalog matches git
        run: |
          go generate ./internal/proxyconf
          git diff --exit-code -- internal/proxyconf/catalog_gen.go
      - name: Official upstream schema pin
        run: |
          chmod +x scripts/check-upstream-schema.sh
          ./scripts/check-upstream-schema.sh
